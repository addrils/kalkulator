<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator Performa ShopeeFood</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; padding: 20px; background-color: #f8f9fa; color: #333;
    }
    .section {
      background: #ffffff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px; margin-bottom: 30px; max-width: 800px; margin-left: auto; margin-right: auto;
    }
    h2,h3 { margin-top:0; color:#2c3e50; }
    label { display:block; margin-top:15px; font-weight:500; }
    input[type="number"], input[type="date"], input[type="month"], textarea, button {
      padding:10px; margin-top:5px; width:100%; border:1px solid #ccc; border-radius:6px; font-size:16px;
    }
    textarea { resize:vertical; }
    input:focus, button:focus, textarea:focus { outline:none; border-color:#007bff; box-shadow:0 0 3px rgba(0,123,255,0.5);}
    button { background-color:#007bff; color:white; cursor:pointer; transition:0.3s; }
    button:hover { background-color:#0056b3; }
    .danger { background-color:#dc3545; }
    .danger:hover { background-color:#a71d2a; }
    .result { margin-top:15px; font-weight:bold; font-size:18px; text-align:center; color:#28a745; }
    table { width:100%; border-collapse:collapse; margin-top:15px; background-color:#fff; }
    th,td { border:1px solid #dee2e6; padding:10px; text-align:center; }
    th { background-color:#f1f1f1; }
    @media(max-width:600px){ input,button,textarea{font-size:14px;} .result{font-size:16px;} th,td{padding:6px;} }
  </style>
</head>
<body>

<div class="section">
  <h2>ShopeeFood</h2>
  <label>Tanggal: <input type="date" id="shopee-date"></label>
  <label>Penyelesaian Food: <input type="number" id="shopee-food"></label>
  <label>Penyelesaian Paket: <input type="number" id="shopee-paket"></label>
  <label>Dibatalkan: <input type="number" id="shopee-cancel"></label>
  <button onclick="simpanShopee()">Hitung & Simpan</button>
  <div class="result" id="shopee-result"></div>
</div>

<div class="section">
  <h3>Histori Harian</h3>
  <label>Pilih Tanggal: <input type="date" id="shopee-filter-harian" onchange="tampilkanShopee('harian')"></label>
  <div id="shopee-harian"></div>
</div>

<div class="section">
  <h3>Rolling Window 7 Hari</h3>
  <label>Pilih Tanggal Akhir: <input type="date" id="shopee-filter-7" onchange="tampilkanShopee('window7')"></label>
  <div id="shopee-window-7"></div>
</div>

<div class="section">
  <h3>Rolling Window 3 Hari</h3>
  <label>Pilih Tanggal Akhir: <input type="date" id="shopee-filter-3" onchange="tampilkanShopee('window3')"></label>
  <div id="shopee-window-3"></div>
</div>

<div class="section">
  <h3>Histori Bulanan</h3>
  <input type="month" id="shopee-filter-bulan" onchange="tampilkanShopee('bulanan')">
  <div id="shopee-bulanan"></div>
</div>

<div class="section">
  <h3>Histori Keseluruhan</h3>
  <div id="shopee-semua"></div>
</div>

<div class="section">
  <h3>Backup & Restore Data</h3>
  <button onclick="salinBackupShopee()">📋 Salin Backup</button>
  <label>Data backup:</label>
  <textarea id="backup-output" rows="5"></textarea>
  <label style="margin-top:15px;">Tempel data backup di sini:</label>
  <textarea id="restore-input" rows="5" placeholder='{"2025-08-01":{"food":2,"paket":1,"cancel":1,"performa":"75.00"}}'></textarea>
  <button onclick="restoreBackupShopee()">🔄 Restore Backup</button>
</div>

<div class="section">
  <h3>Hapus Data</h3>
  <button class="danger" onclick="hapusSemuaShopee()">🗑 Hapus Semua Data ShopeeFood</button>
</div>

<script>
const formatter = new Intl.NumberFormat('id-ID');

function simpanData(key,date,data){let db=JSON.parse(localStorage.getItem(key))||{}; db[date]=data; localStorage.setItem(key,JSON.stringify(db));}
function ambilData(key){return JSON.parse(localStorage.getItem(key))||{};}
function hitungPerforma(selesai,cancel){const total=selesai+cancel; return total?((selesai/total)*100).toFixed(2):"0.00";}

function simpanShopee(){
  const date=document.getElementById("shopee-date").value;
  if(!date) return alert("Tanggal harus diisi!");
  const food=+document.getElementById("shopee-food").value||0;
  const paket=+document.getElementById("shopee-paket").value||0;
  const cancel=+document.getElementById("shopee-cancel").value||0;
  if([food,paket,cancel].some(n=>n<0)) return alert("Input tidak boleh negatif!");
  const selesai=food+paket;
  const performa=hitungPerforma(selesai,cancel);
  simpanData("shopee",date,{food,paket,cancel,performa});
  document.getElementById("shopee-result").innerText=`Performa: ${performa}% (tersimpan)`;
  ["harian","window7","window3","bulanan"].forEach(f=>tampilkanShopee(f));
  tampilkanShopee();
}

function tampilkanShopee(filter=null){
  const data=ambilData("shopee");
  const harianDiv=document.getElementById("shopee-harian");
  const bulananDiv=document.getElementById("shopee-bulanan");
  const semuaDiv=document.getElementById("shopee-semua");
  const window7Div=document.getElementById("shopee-window-7");
  const window3Div=document.getElementById("shopee-window-3");

  if(filter==="harian"){
    const tgl=document.getElementById("shopee-filter-harian").value;
    if(!tgl||!data[tgl]) return harianDiv.innerHTML=`<p>Data untuk tanggal <strong>${tgl}</strong> tidak ditemukan.</p>`;
    const d=data[tgl];
    harianDiv.innerHTML=`
      <table>
        <tr><th colspan="2">${tgl}</th></tr>
        <tr><td>Food</td><td>${formatter.format(d.food)}</td></tr>
        <tr><td>Paket</td><td>${formatter.format(d.paket)}</td></tr>
        <tr><td>Dibatalkan</td><td>${formatter.format(d.cancel)}</td></tr>
        <tr><td>Performa</td><td style="color:${d.performa<80?'red':'green'}">${d.performa}%</td></tr>
      </table>`;
  }

  ["window7","window3"].forEach(w=>{
    const inputDate=document.getElementById(`shopee-filter-${w==='window7'?7:3}`).value;
    const div=w==='window7'?window7Div:window3Div;
    if(!inputDate){div.innerHTML="<p>Silakan pilih tanggal akhir.</p>"; return;}
    const end=new Date(inputDate);
    const start=new Date(end); start.setDate(end.getDate()-(w==='window7'?6:2));
    let total={food:0,paket:0,cancel:0};
    for(const tgl in data){
      const d=new Date(tgl);
      if(d>=start&&d<=end){const val=data[tgl]; total.food+=val.food; total.paket+=val.paket; total.cancel+=val.cancel;}
    }
    const selesai=total.food+total.paket;
    const performa=hitungPerforma(selesai,total.cancel);
    div.innerHTML=`
      <p>Periode: ${start.toISOString().slice(0,10)} – ${end.toISOString().slice(0,10)}</p>
      <table>
        <tr><th>Food</th><th>Paket</th><th>Dibatalkan</th><th>Performa</th></tr>
        <tr>
          <td>${formatter.format(total.food)}</td>
          <td>${formatter.format(total.paket)}</td>
          <td>${formatter.format(total.cancel)}</td>
          <td style="color:${performa<80?'red':'green'}">${performa}%</td>
        </tr>
      </table>`;
  });

  if(filter==="bulanan"){
    const bulan=document.getElementById("shopee-filter-bulan").value;
    let total={food:0,paket:0,cancel:0};
    for(const tgl in data){if(tgl.startsWith(bulan)){const d=data[tgl]; total.food+=d.food; total.paket+=d.paket; total.cancel+=d.cancel;}}
    const selesai=total.food+total.paket;
    const performa=hitungPerforma(selesai,total.cancel);
    bulananDiv.innerHTML=`
      <table>
        <tr><th>Food</th><th>Paket</th><th>Dibatalkan</th><th>Performa</th></tr>
        <tr>
          <td>${formatter.format(total.food)}</td>
          <td>${formatter.format(total.paket)}</td>
          <td>${formatter.format(total.cancel)}</td>
          <td style="color:${performa<80?'red':'green'}">${performa}%</td>
        </tr>
      </table>`;
  }

  let totalAll={food:0,paket:0,cancel:0};
  for(const tgl in data){const d=data[tgl]; totalAll.food+=d.food; totalAll.paket+=d.paket; totalAll.cancel+=d.cancel;}
  const selesaiAll=totalAll.food+totalAll.paket;
  const performaAll=hitungPerforma(selesaiAll,totalAll.cancel);
  semuaDiv.innerHTML=`
    <table>
      <tr><th>Food</th><th>Paket</th><th>Dibatalkan</th><th>Performa</th></tr>
      <tr>
        <td>${formatter.format(totalAll.food)}</td>
        <td>${formatter.format(totalAll.paket)}</td>
        <td>${formatter.format(totalAll.cancel)}</td>
        <td style="color:${performaAll<80?'red':'green'}">${performaAll}%</td>
      </tr>
    </table>`;
}

function hapusSemuaShopee(){if(confirm("Yakin ingin menghapus semua data ShopeeFood?")){localStorage.removeItem("shopee"); tampilkanShopee();}}
function salinBackupShopee(){const data=localStorage.getItem("shopee")||"{}"; navigator.clipboard.writeText(data).then(()=>alert("Backup berhasil disalin ke clipboard.")); document.getElementById("backup-output").value=data;}
function restoreBackupShopee(){const data=document.getElementById("restore-input").value; try{localStorage.setItem("shopee",JSON.stringify(JSON.parse(data))); alert("Data berhasil direstore!"); tampilkanShopee();}catch{alert("Format data tidak valid!");}}

tampilkanShopee();
</script>

</body>
</html>
